# Workflow for building and deploying odata2ts docs site to GitHub Pages
##
name: Deploy odata2ts docs to Github Pages

on:
  # Runs on pushes targeting the release branch
  push:
    branches:
      - main

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  release-please:
    runs-on: ubuntu-latest
    # Do not run on forks
    if: github.repository == 'odata2ts/odata2ts.github.io'
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Fetches full history so git log and releases work perfectly
      - id: release
        uses: googleapis/release-please-action@v5.0.0
        with:
          release-type: 'node'
          config-file: release-please-config.json
          target-branch: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}


  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: release-please
    # Only deploys when release-please actually creates and closes the release (merges the PR)
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Install dependencies
        run: yarn --immutable
      - name: Build with docusaurus
        run: yarn build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./build
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
